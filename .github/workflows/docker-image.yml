name: Docker Image CI

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag wseresearch/microservice-updater-frontend:latest
    - name: Docker Login
      if: startsWith(github.ref, 'refs/tags/')
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Tag docker image version
      if: startsWith(github.ref, 'refs/tags/')
      run: docker tag wseresearch/microservice-updater-frontend:latest "wseresearch/microservice-updater-frontend:${{ github.ref_name }}"
    - name: Push latest docker image
      if: startsWith(github.ref, 'refs/tags/')
      run: docker push wseresearch/microservice-updater-frontend:latest
    - name: Push tagged version image
      if: startsWith(github.ref, 'refs/tags/')
      run: docker push "wseresearch/microservice-updater-frontend:${{ github.ref_name }}"
    - name: Create deployment setup
      if: startsWith(github.ref, 'refs/tags/')
      run: echo "BACKEND_URL=${{ secrets.URL }}" > service_config/files/env
    - name: Init update
      if: startsWith(github.ref, 'refs/tags/')
      uses: WSE-research/docker-service-updater@v0.2.0
      with:
        updater_host: ${{ secrets.UPDATER_HOST }}
        api_key: ${{ secrets.API_KEY }}